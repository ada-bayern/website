{% import "macros/content.html" as content %}
{% set data = load_data(path=data_path) %}

<section class="initiators container" aria-labelledby="initiators-partner-heading">
    <!-- <h1 class="huge">
        Netzwerk
    </h1> -->
    <h2 id="initiators-partner-heading">Partner</h2>
    <ul class="partners">

        {%- for partner in data.partner %}
        <li class="partner">
            <a href="{{ partner.url }}" target="_blank" rel="noopener noreferrer"
                aria-label="{{ partner.name }} (öffnet in neuem Tab)">
                <img src="{{ content::base_path() }}{{ partner.logo }}" alt="{{ partner.name }} Logo">
            </a>

        </li>

        {% endfor -%}
    </ul>
    
    <ul class="partners1">

        {%- for partner1 in data.partner1 %}
        <li class="partner1">
            <a href="{{ partner1.url }}" target="_blank" rel="noopener noreferrer"
                aria-label="{{ partner1.name }} (öffnet in neuem Tab)">
                <img src="{{ content::base_path() }}{{ partner1.logo }}" alt="{{ partner1.name }} Logo">
            </a>

        </li>

        {% endfor -%}
    </ul>

    <div class="divider2" aria-hidden="true"><div class="line"></div></div>

    <h2 id="initiators-clients-heading">Kunden</h2>
    <ul class="clients" aria-labelledby="initiators-clients-heading">
        {%- for client in data.client %}
        <li class="client">
            <a href="{{ client.url }}" target="_blank" rel="noopener noreferrer"
                aria-label="{{ client.name }} (öffnet in neuem Tab)">
                <img src="{{ content::base_path() }}{{ client.logo }}" alt="{{ client.name }} Logo">
            </a>
        </li>
        {% endfor -%}
    </ul>
</section>
